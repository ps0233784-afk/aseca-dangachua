# Render deployment blueprint — BRANCH ASECA DANGACHUA
# One Web Service runs the Express API and serves the built React app.
# SQLite data file lives on the service disk; the database auto-seeds on boot
# (set SEED_ON_BOOT=true). For persistent data across deploys, attach a paid
# Disk mounted at /var/data (see disk section below) — free tier reseeds.
services:
  - type: web
    name: asecadangachua
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm run install:all && npm run build
    startCommand: node server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ON_BOOT
        value: "true"
      - key: DATA_DIR
        value: /var/data
    # Paid persistence (optional): uncomment to keep SQLite data across deploys.
    # disk:
    #   name: asecadata
    #   mountPath: /var/data
    #   sizeGB: 1
